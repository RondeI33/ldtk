name: LDTK-Smartive release

on:
  # Updates to master do not auto-publish. The manual build calls this workflow
  # after the full editor regression gates pass, reusing its Slack notifier.
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        required: false
        default: false
      notify_slack:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and replace the release for the current package version
        required: false
        type: boolean
        default: false
      notify_slack:
        description: Send the published release announcement to the configured Slack webhook
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ldtk-smartive-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Smartive version and release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v${VERSION}"

          VERSION="$VERSION" node <<'NODE'
          const version = process.env.VERSION;
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          if (!match) {
            throw new Error(`Smartive version must be stable SemVer (major.minor.patch), got: ${version}`);
          }
          const [major, minor, patch] = match.slice(1).map(Number);
          if (major < 1) {
            throw new Error(`Smartive versioning starts at 1.0.0, got: ${version}`);
          }
          if (![major, minor, patch].every(Number.isSafeInteger)) {
            throw new Error(`Invalid Smartive version: ${version}`);
          }
          NODE

          if ! grep -Fxq "# ${VERSION}" docs/SMARTIVE_CHANGELOG.md; then
            echo "docs/SMARTIVE_CHANGELOG.md is missing a '# ${VERSION}' section."
            exit 1
          fi

          NOTES=$(awk -v version="$VERSION" '
            $0 == "# " version { found=1; next }
            found && /^# / { exit }
            found { print }
          ' docs/SMARTIVE_CHANGELOG.md)
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "The changelog section for ${VERSION} is empty."
            exit 1
          fi
          if printf '%s\n' "$NOTES" | grep -qi 'TODO'; then
            echo "The changelog section for ${VERSION} still contains TODO text."
            exit 1
          fi

          SHOULD_RELEASE=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE_REBUILD" != "true" ]; then
            SHOULD_RELEASE=false
            echo "Release ${TAG} already exists; nothing to publish."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Smartive version: $VERSION"
          echo "LDtk JSON compatibility version: $(tr -d '\r\n' < docs/version.txt)"

  entity-runtime:
    # Run all editor regressions on Linux. The macOS release gate intentionally
    # runs only camera-preview and entity/history smoke checks to avoid repeating
    # the full macOS suite on every installer build.
    # Full Linux + macOS regressions remain in drawable-shapes-preflight.yml.
    # Every installer still waits for both release platform gates.
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 25 || 35 }}
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Unity camera preview real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1100x24" npm run test:camera-preview
      - name: Unity camera preview real Electron regression (macOS Intel)
        if: runner.os == 'macOS'
        working-directory: app
        run: npm run test:camera-preview
      - name: CargoLine path preview real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1100x24" npm run test:path-preview
      - name: Point placement real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1100x24" npm run test:points
      - name: Entity selection/history real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/run-entity-history-tests.cjs
      # Electron 24 cannot initialize WebGL on headless GitHub macOS ARM64;
      # run GUI regression on Intel, and keep universal arm64+Intel packaging.
      - name: Entity selection/history real Electron regression (macOS Intel)
        if: runner.os == 'macOS'
        working-directory: app
        run: node scripts/run-entity-history-tests.cjs
      - name: Auto-chain back references real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:entity-chain
      - name: Multi-entity field editor real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1100x24" npm run test:entity-multi
      - name: Drawable shapes and color picker real Electron regression
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1100x24" npm run test:drawable-shapes
      - uses: actions/upload-artifact@v4
        if: always()
        # Test logs are diagnostic only. A transient GitHub ArtifactService outage
        # must not block packaging after every executable regression passed.
        # Release installer artifact uploads remain strict/fatal.
        continue-on-error: true
        with:
          name: entity-runtime-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          path: |
            app/test-results/camera-preview
            app/test-results/path-preview
            app/test-results/points
            app/test-results/entity-history
            app/test-results/entity-chain
            app/test-results/entity-multi
            app/test-results/drawable-shapes
          if-no-files-found: warn

  windows:
    needs: [prepare, entity-runtime, template-runtime, selection-runtime]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      SMARTIVE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - name: Install Haxe libraries
        run: haxe setup.hxml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: PSD import runtime smoke test
        working-directory: app
        run: npm run test:psd-import

      - name: Verify package version
        working-directory: app
        shell: bash
        run: node -e "const p=require('./package.json'); if(p.version!==process.env.SMARTIVE_VERSION) throw new Error('Version mismatch')"

      - name: Compile fork
        working-directory: app
        run: npm run compile

      - name: Package Windows x64 with update metadata
        working-directory: app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build --win --x64 --publish never

      - name: Collect Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $installer = Get-ChildItem -Path "app/redist" -Filter "LDTK-Smartive-$env:SMARTIVE_VERSION-win-x64.exe" | Select-Object -First 1
          if (-not $installer) {
            Get-ChildItem -Path "app/redist" | Format-Table Name, Length
            throw "LDTK-Smartive Windows installer was not produced"
          }
          Copy-Item $installer.FullName "dist/"

          $blockmap = "$($installer.FullName).blockmap"
          if (Test-Path $blockmap) {
            Copy-Item $blockmap "dist/"
          }

          $latest = "app/redist/latest.yml"
          if (-not (Test-Path $latest)) {
            Get-ChildItem -Path "app/redist" | Format-Table Name, Length
            throw "latest.yml was not produced; Windows auto-update would not work"
          }
          Copy-Item $latest "dist/latest.yml"

      - uses: actions/upload-artifact@v4
        with:
          name: ldtk-smartive-${{ needs.prepare.outputs.version }}-windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: [prepare, entity-runtime, template-runtime, selection-runtime]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    env:
      SMARTIVE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - run: haxe setup.hxml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: PSD import runtime smoke test
        working-directory: app
        run: npm run test:psd-import

      - name: Package universal macOS
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack-macos

      - name: Collect macOS release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG=$(find app/redist -maxdepth 1 -type f -name "LDTK-Smartive-${SMARTIVE_VERSION}-mac-*.dmg" | head -n 1)
          if [ -z "$DMG" ]; then
            find app/redist -maxdepth 1 -type f -print
            echo "LDTK-Smartive macOS DMG was not produced"
            exit 1
          fi
          cp "$DMG" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ldtk-smartive-${{ needs.prepare.outputs.version }}-macos
          path: dist/*
          if-no-files-found: error

  linux:
    needs: [prepare, entity-runtime, template-runtime, selection-runtime]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      SMARTIVE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - run: haxe setup.hxml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Package Linux x64 AppImage
        working-directory: app
        run: npm run pack-linux-x86

      - name: Collect Linux release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APPIMAGE=$(find app/redist -maxdepth 1 -type f -name "LDTK-Smartive-${SMARTIVE_VERSION}-linux-*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            find app/redist -maxdepth 1 -type f -print
            echo "LDTK-Smartive Linux AppImage was not produced"
            exit 1
          fi
          cp "$APPIMAGE" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ldtk-smartive-${{ needs.prepare.outputs.version }}-linux
          path: dist/*
          if-no-files-found: error


  template-runtime:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Template model and actual Electron UI regression
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:templates
      - uses: actions/upload-artifact@v4
        if: always()
        # Test logs are diagnostic only. A transient GitHub ArtifactService outage
        # must not block packaging after every executable regression passed.
        # Release installer artifact uploads remain strict/fatal.
        continue-on-error: true
        with:
          name: template-runtime-${{ needs.prepare.outputs.version }}
          path: app/test-results/templates
          if-no-files-found: warn


  selection-runtime:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Selection move/copy Electron regression
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:selection
      - uses: actions/upload-artifact@v4
        if: always()
        # Test logs are diagnostic only. A transient GitHub ArtifactService outage
        # must not block packaging after every executable regression passed.
        # Release installer artifact uploads remain strict/fatal.
        continue-on-error: true
        with:
          name: selection-runtime-${{ needs.prepare.outputs.version }}
          path: app/test-results/selection
          if-no-files-found: warn

  publish:
    needs: [prepare, entity-runtime, windows, macos, linux, template-runtime, selection-runtime]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      SMARTIVE_VERSION: ${{ needs.prepare.outputs.version }}
      SMARTIVE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ldtk-smartive-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "LDTK-Smartive ${SMARTIVE_VERSION}"
            echo
            awk -v version="$SMARTIVE_VERSION" '
              $0 == "# " version { found=1; next }
              found && /^# / { exit }
              found { print }
            ' docs/SMARTIVE_CHANGELOG.md
            echo
            echo "Compatibility: LDtk JSON format $(tr -d '\r\n' < docs/version.txt)."
          } > release-notes.md

      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Remove the original one-off prerelease/tag, if present.
          LEGACY_TAG="ldtk-smartive-v${SMARTIVE_VERSION}"
          gh release delete "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          # A forced rebuild or a previously interrupted publication can leave a release/tag behind.
          gh release delete "$SMARTIVE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SMARTIVE_TAG}" >/dev/null 2>&1 || true

          test -f dist/latest.yml
          ls -lah dist

          gh release create "$SMARTIVE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LDTK-Smartive ${SMARTIVE_VERSION}" \
            --notes-file release-notes.md \
            --latest

  notify-slack:
    # Notification is a separate job: if Slack fails, rerun this failed job
    # without rebuilding packages or deleting/replacing a published release.
    name: Announce published Smartive release on Slack
    needs: [prepare, publish]
    if: needs.publish.result == 'success' && inputs.notify_slack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and send Slack announcement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMARTIVE_TAG: ${{ needs.prepare.outputs.tag }}
        run: bash app/scripts/notify-smartive-release-slack.sh "$SMARTIVE_TAG"

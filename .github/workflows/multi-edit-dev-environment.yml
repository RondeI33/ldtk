name: Multi-entity development environment

on:
  push:
    branches: [feature/entity-multi-edit]
    paths: [.github/workflows/multi-edit-dev-environment.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare dependencies for offline functional testing
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Export source and public development dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/multi-edit-env/repo /tmp/multi-edit-env/tools
          git archive HEAD | tar -x -C /tmp/multi-edit-env/repo
          cp -a app/node_modules /tmp/multi-edit-env/repo/app/
          cp -a "$(haxelib config)" /tmp/multi-edit-env/haxelib
          cp -a "$(dirname "$(command -v haxe)")" /tmp/multi-edit-env/tools/haxe
          cp -a "$NEKOPATH" /tmp/multi-edit-env/tools/neko
          cd /tmp
          tar -czf multi-edit-env.tar.gz multi-edit-env
      - uses: actions/upload-artifact@v4
        with:
          name: multi-edit-dev-environment
          path: /tmp/multi-edit-env.tar.gz
          retention-days: 1
          compression-level: 0

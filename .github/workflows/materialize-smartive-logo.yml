name: Materialize Smartive logo

on:
  push:
    branches:
      - feature/smartive-branding-logo
    paths:
      - branding-source/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate application icon assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image

          source = Image.open('branding-source/smartive-logo.webp').convert('RGBA')
          source = source.resize((512, 512), Image.Resampling.LANCZOS)

          source.save('app/assets/appIcon.png', format='PNG', optimize=True)
          source.save('app/buildAssets/icon.png', format='PNG', optimize=True)
          source.save(
              'app/buildAssets/icon.ico',
              format='ICO',
              sizes=[(16,16), (24,24), (32,32), (48,48), (64,64), (128,128), (256,256)],
          )
          source.save('app/buildAssets/icon.icns', format='ICNS')
          PY

      - name: Commit generated logo assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/appIcon.png app/buildAssets/icon.png app/buildAssets/icon.ico app/buildAssets/icon.icns
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace LDtk application icons with Smartive logo"
          git push

name: Apply Smartive source branding

on:
  push:
    branches:
      - feature/auto-place-sub-entities
    paths:
      - .github/workflows/temporary-smartive-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-place-sub-entities

      - name: Patch updater repository and native window title
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/electron.renderer/App.hx"): (
                  'dn.js.ElectronUpdater.fetchLatestGitHubReleaseVersion("deepnight","ldtk", (latest)->{',
                  'dn.js.ElectronUpdater.fetchLatestGitHubReleaseVersion("RondeI33","ldtk", (latest)->{',
              ),
              Path("src/electron.main/ElectronMain.hx"): (
                  'title: "LDtk",',
                  'title: "LDTK-Smartive",',
              ),
          }

          for file_path, (old, new) in replacements.items():
              content = file_path.read_text(encoding="utf-8")
              if new in content:
                  continue
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {file_path}, found {count}")
              file_path.write_text(content.replace(old, new), encoding="utf-8")

          Path(".github/workflows/temporary-smartive-source-patch.yml").unlink()
          PY
          git diff --check

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/electron.renderer/App.hx src/electron.main/ElectronMain.hx .github/workflows/temporary-smartive-source-patch.yml
          git commit -m "Wire Smartive updater and window branding"
          git push origin HEAD:feature/auto-place-sub-entities

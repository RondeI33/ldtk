name: Apply lighting Visuals toolbar patch

on:
  push:
    branches:
      - feature/lighting-visuals-toolbar
    paths:
      - scripts/patch-lighting-visuals-toolbar.py
      - .github/workflows/apply-lighting-visuals-toolbar-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lighting-visuals-toolbar
          fetch-depth: 0

      - name: Patch LightPreview UI
        run: python3 scripts/patch-lighting-visuals-toolbar.py

      - name: Commit source patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/electron.renderer/display/LightPreview.hx
          git commit -m "Move lighting preview controls into Visuals toolbar"
          git push origin HEAD:feature/lighting-visuals-toolbar

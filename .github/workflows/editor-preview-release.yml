name: Lighting Visuals toolbar release

on:
  push:
    branches:
      - fix/lighting-toolbar-sizing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ldtk-lighting-visuals-toolbar-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - name: Install Haxe libraries
        shell: bash
        run: |
          haxelib install uuid --quiet
          haxelib git castle https://github.com/ncannasse/castle
          haxelib git heaps https://github.com/deepnight/heaps.git
          haxelib git hxnodejs https://github.com/HaxeFoundation/hxnodejs.git
          haxelib git electron https://github.com/tong/hxelectron.git
          haxelib git heaps-aseprite https://github.com/AustinEast/heaps-aseprite.git
          haxelib git ldtk-haxe-api https://github.com/deepnight/ldtk-haxe-api.git --always
          haxelib git deepnightLibs https://github.com/deepnight/deepnightLibs.git --always

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Compile fork
        working-directory: app
        run: npm run compile

      - name: Package Windows x64
        working-directory: app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build --win --x64 --publish never

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "app/redist" -Filter "LDtk * installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "LDtk Windows installer was not produced" }
          Copy-Item $installer.FullName "LDtk-1.5.3-Lighting-Visuals-Toolbar-win-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: lighting-visuals-windows
          path: LDtk-1.5.3-Lighting-Visuals-Toolbar-win-x64.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - run: haxe setup.hxml

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Package universal macOS
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack-macos

      - name: Rename macOS installer
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "LDtk macOS DMG was not produced"
            exit 1
          fi
          cp "$DMG" "LDtk-1.5.3-Lighting-Visuals-Toolbar-macOS-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: lighting-visuals-macos
          path: LDtk-1.5.3-Lighting-Visuals-Toolbar-macOS-universal.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - run: haxe setup.hxml

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Package Linux x86_64 AppImage
        working-directory: app
        run: npm run pack-linux-x86

      - name: Rename Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "LDtk Linux AppImage was not produced"
            exit 1
          fi
          cp "$APPIMAGE" "LDtk-1.5.3-Lighting-Visuals-Toolbar-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: lighting-visuals-linux
          path: LDtk-1.5.3-Lighting-Visuals-Toolbar-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lighting-visuals-*
          merge-multiple: true
          path: dist

      - name: Publish cross-platform prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="lighting-visuals-toolbar"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LDtk 1.5.3 - Lighting Visuals Toolbar" \
            --notes "Corrected cross-platform prerelease of the RondeI33 LDtk fork. Lighting controls are inside LDtk's native Visuals tool strip and now use the editor's native 24x24 .icon sizing and native .active state styling, fixing the oversized vertical controls introduced by the previous build. Controls remain U (Unlit), L (Lit), S (Lit + Shadows), and LR (low-resolution preview). The intrusive floating lighting panel remains removed. Includes animated tile preview, Aseprite/ASE support, Atlas Composer, and Unity-style 2D lighting preview features. Windows x64, universal macOS, and Linux x86_64 AppImage are included." \
            --prerelease

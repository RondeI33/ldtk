name: Verify entity UI preview fix

on:
  push:
    branches:
      - feature/auto-place-sub-entities

permissions:
  contents: write

concurrency:
  group: entity-ui-preview-fix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-place-sub-entities
          fetch-depth: 0

      - name: Apply entity UI preview fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply_entity_ui_preview_fix.py
          git diff --check

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - name: Install fork dependencies
        run: haxe setup.hxml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Compile editor
        working-directory: app
        run: npm run compile

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/apply_entity_ui_preview_fix.py
          rm -f .github/workflows/entity-ui-preview-fix.yml
          git add app/assets/css/app.scss app/assets/css/app.min.css app/assets/tpl/pages/editor.html \
            src/electron.renderer/page/Editor.hx src/electron.renderer/display/EntityRender.hx \
            .github/apply_entity_ui_preview_fix.py .github/workflows/entity-ui-preview-fix.yml
          git diff --cached --check
          git commit -m "Fix entity editor scrolling and variable previews"
          git push origin HEAD:feature/auto-place-sub-entities

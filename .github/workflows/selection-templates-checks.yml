name: Selection Templates checks

on:
  push:
    branches: [feature/selection-templates]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: selection-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture source for development diagnostics
        run: git archive --format=tar.gz -o /tmp/ldtk-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ldtk-source-diagnostics
          path: /tmp/ldtk-source.tar.gz
          retention-days: 3

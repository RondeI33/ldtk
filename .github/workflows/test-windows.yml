name: LDTK-Smartive manual release build

# The existing release workflow owns all tests, packaging and Slack notification.
# Temporary opt-in push trigger for the user-requested repair/build cycle.
# Ordinary pushes cannot publish: they lack the explicit [run-release] marker.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/test-windows.yml

permissions:
  contents: write

concurrency:
  group: smartive-manual-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-release]')
    name: Run release regressions, package, publish and notify Slack
    uses: ./.github/workflows/ldtk-smartive-1.0.0-release.yml
    with:
      force_rebuild: false
    secrets: inherit

name: Fix Smartive release collection

on:
  push:
    branches:
      - feature/auto-place-sub-entities
    paths:
      - .github/workflows/temporary-fix-smartive-release.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-place-sub-entities

      - name: Fix dynamic release workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ldtk-smartive-1.0.0-release.yml')
          content = workflow.read_text(encoding='utf-8')

          old_paths = '''    paths:\n      - app/package.json\n'''
          new_paths = '''    paths:\n      - app/package.json\n      - docs/SMARTIVE_CHANGELOG.md\n      - .github/workflows/ldtk-smartive-1.0.0-release.yml\n'''
          if new_paths not in content:
              if content.count(old_paths) != 1:
                  raise RuntimeError('Could not locate release workflow path filter')
              content = content.replace(old_paths, new_paths)

          content = content.replace(
              '  # This fixed group also cancels the original one-off 1.0.0 workflow run.\n  group: ldtk-smartive-1.0.0-release',
              '  group: ldtk-smartive-release',
          )

          old_linux = 'LDTK-Smartive-${SMARTIVE_VERSION}-linux-x64.AppImage'
          new_linux = 'LDTK-Smartive-${SMARTIVE_VERSION}-linux-*.AppImage'
          if new_linux not in content:
              if content.count(old_linux) != 1:
                  raise RuntimeError('Could not locate Linux artifact matcher')
              content = content.replace(old_linux, new_linux)

          workflow.write_text(content, encoding='utf-8')
          Path('.github/workflows/temporary-fix-smartive-release.yml').unlink()
          PY
          git diff --check

      - name: Commit release fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ldtk-smartive-1.0.0-release.yml .github/workflows/temporary-fix-smartive-release.yml
          git commit -m "Fix Smartive Linux release artifact matching"
          git push origin HEAD:feature/auto-place-sub-entities

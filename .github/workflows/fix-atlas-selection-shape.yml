name: Fix Atlas Composer selection shape

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-atlas-selection-shape.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Preserve each source selection as one shape
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/electron.renderer/misc/TilesetAtlasComposer.hx')
          text = path.read_text(encoding='utf-8')

          old_sig = '''\tstatic function buildUnits(td:TilesetDef, ids:Array<Int>, groups:Array<Array<Int>>) : Array<PackUnit> {\n'''
          new_sig = '''\tstatic function buildUnits(td:TilesetDef, ids:Array<Int>, groups:Array<Array<Int>>, preserveWholeShape=false) : Array<PackUnit> {\n\t\t// Destination selections are intentionally kept as ONE shape per source\n\t\t// tileset. Their original relative tile coordinates are preserved,\n\t\t// including any unselected holes inside the bounding box. This may leave\n\t\t// transparent/empty space in the composed atlas, by design. Remainder\n\t\t// atlases still use the compact protected-group packing below.\n\t\tif( preserveWholeShape ) {\n\t\t\tvar clean = validIds(td,ids);\n\t\t\tif( clean.length==0 ) return [];\n\t\t\tvar minX = 0x3fffffff;\n\t\t\tvar minY = 0x3fffffff;\n\t\t\tvar maxX = -1;\n\t\t\tvar maxY = -1;\n\t\t\tfor(id in clean) {\n\t\t\t\tminX = dn.M.imin(minX,td.getTileCx(id));\n\t\t\t\tminY = dn.M.imin(minY,td.getTileCy(id));\n\t\t\t\tmaxX = dn.M.imax(maxX,td.getTileCx(id));\n\t\t\t\tmaxY = dn.M.imax(maxY,td.getTileCy(id));\n\t\t\t}\n\t\t\treturn [{\n\t\t\t\tsourceUid:td.uid,\n\t\t\t\tids:clean,\n\t\t\t\tminX:minX,\n\t\t\t\tminY:minY,\n\t\t\t\twid:maxX-minX+1,\n\t\t\t\thei:maxY-minY+1,\n\t\t\t\toutX:0,\n\t\t\t\toutY:0,\n\t\t\t}];\n\t\t}\n'''
          if old_sig not in text:
              raise SystemExit('buildUnits signature not found')
          text = text.replace(old_sig, new_sig, 1)

          old_call = '''\t\t\tdestinationUnits = destinationUnits.concat(buildUnits(td,mapKeys(selectedBySource.get(uid)),groupsBySource.get(uid)));'''
          new_call = '''\t\t\tdestinationUnits = destinationUnits.concat(buildUnits(td,mapKeys(selectedBySource.get(uid)),groupsBySource.get(uid),true));'''
          if old_call not in text:
              raise SystemExit('destination buildUnits call not found')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-atlas-selection-shape.yml
          git add src/electron.renderer/misc/TilesetAtlasComposer.hx
          git commit -m "Preserve selected tile shapes in Atlas Composer"
          git push origin master

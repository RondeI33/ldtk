name: Assemble verified camera refinement
on:
  push:
    branches: [feature/joshua-camera-preview-lock]
    paths: ['.github/workflows/apply-camera-refinement.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify tested source tree without publishing or moving branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp .github/dev/camera-refinement.xz "$RUNNER_TEMP/camera-refinement.xz"
          git fetch origin 68fd528a6088b2503c13c7b0f9c9e67acb2fdaea --depth=1
          git config core.autocrlf false
          git read-tree --reset -u 68fd528a6088b2503c13c7b0f9c9e67acb2fdaea
          python3 <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess
          raw = lzma.decompress((pathlib.Path(os.environ['RUNNER_TEMP']) / 'camera-refinement.xz').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == 'bba69a75e9c554334c4732ae9b4b2ff8e855214a882ca00519d560ee98bf5516', 'Payload checksum mismatch'
          plan = json.loads(raw)
          assert plan['baseTree'] == 'b288f74c52844746036edbf79d6cc3772abd6120'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == plan['baseTree']
          elements = []
          for entry in plan['files']:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              if entry['before'] is None:
                  assert not path.exists(), str(path)
                  before = b''
              else:
                  before = path.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == entry['before'], str(path)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              content = ''.join(lines)
              after = content.encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              subprocess.run(['git', 'add', '--', str(path)], check=True)
              elements.append({'path': str(path), 'mode': '100644', 'type': 'blob', 'content': content})
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual == plan['tree'] == 'ecba30e89dea9c410c69d870f1257ef682b21d44', actual
          def api(endpoint, data):
              result = subprocess.check_output(['gh', 'api', '--method', 'POST', endpoint, '--input', '-'], input=json.dumps(data), text=True)
              return json.loads(result)
          repo = os.environ['GITHUB_REPOSITORY']
          tree = api(f'repos/{repo}/git/trees', {'base_tree': plan['baseTree'], 'tree': elements})
          assert tree['sha'] == actual, tree['sha']
          commit = api(f'repos/{repo}/git/commits', {'message': 'feat(camera): consolidate Joshua preview, sprite calibration and 1.0.35 verification', 'tree': actual, 'parents': [os.environ['GITHUB_SHA'], '68fd528a6088b2503c13c7b0f9c9e67acb2fdaea']})
          print('VERIFIED_TREE=' + actual)
          print('CANDIDATE_SHA=' + commit['sha'])
          print('No branch was moved; no installer or release was produced.')
          PY

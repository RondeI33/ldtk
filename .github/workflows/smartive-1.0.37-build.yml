name: Build LDtk Smartive 1.0.37 from master

# One release after the Camera Preview PR is merged.
# The reusable workflow runs native editor regressions on Linux and macOS Intel
# before building and publishing Windows, macOS Universal and Linux installers.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/smartive-1.0.37-build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartive-1.0.37-master-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    name: Camera Preview gates, platform installers and v1.0.37
    uses: ./.github/workflows/ldtk-smartive-1.0.0-release.yml
    with:
      force_rebuild: false
      notify_slack: true
    secrets: inherit

name: LDTK-Smartive manual release build

# Run from master. The existing release pipeline performs all regressions,
# packages Windows/macOS/Linux, publishes a versioned release, then notifies
# Slack using its existing notification step and SLACK_WEBHOOK_URL secret.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartive-manual-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Run release regressions, package, publish and notify Slack
    uses: ./.github/workflows/ldtk-smartive-1.0.0-release.yml
    with:
      # Never overwrite a published version on an ordinary manual build.
      # Bump app/package.json and the changelog for each new release.
      force_rebuild: false
    secrets: inherit

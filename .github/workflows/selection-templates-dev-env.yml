name: Selection Templates development environment

on:
  push:
    branches: [feature/selection-templates]
    paths: [.github/workflows/selection-templates-dev-env.yml]

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - name: Install existing Haxe dependencies
        run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compile baseline
        working-directory: app
        run: npm run compile
      - name: Capture reproducible development dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/ldtk-dev
          cp -a "$(dirname "$(readlink -f "$(command -v haxe)")")" /tmp/ldtk-dev/compiler
          cp -a "$(haxelib config)" /tmp/ldtk-dev/haxelib
          haxelib list > /tmp/ldtk-dev/versions.txt
          tar --exclude='*/.git' -czf /tmp/ldtk-dev.tar.gz -C /tmp ldtk-dev
          tar -czf /tmp/ldtk-runtime.tar.gz app/node_modules app/assets/main.js app/assets/js/renderer.js
      - uses: actions/upload-artifact@v4
        with:
          name: ldtk-development-dependencies
          path: |
            /tmp/ldtk-dev.tar.gz
            /tmp/ldtk-runtime.tar.gz
          retention-days: 3

name: package-raspberry

# Optional ARM packaging must not run on every master edit or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    uses: ./.github/workflows/selection-regression.yml
    with:
      build_candidate: false

  build:
    needs: regression
    strategy:
      matrix:
        os: [ubuntu-latest]
        haxe: [4.3.3]
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v1
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: cd app && npm install
      - run: cd app && npm run pack-linux-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: raspberry-distribution
          path: app/redist/LDTK-Smartive-*-linux-*.AppImage
          if-no-files-found: error

name: Remove LDtk lighting preview

on:
  push:
    branches:
      - remove/lighting-keep-animated-tiles
    paths:
      - .github/workflows/apply-remove-lighting-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove/lighting-keep-animated-tiles
          fetch-depth: 0

      - name: Remove lighting preview code
        run: python3 scripts/remove-lighting-preview.py

      - name: Commit lighting removal and delete helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-remove-lighting-preview.yml scripts/remove-lighting-preview.py
          git add -A
          git commit -m "Remove LDtk lighting preview and keep animated tiles"
          git push origin HEAD:remove/lighting-keep-animated-tiles

name: Multi-entity regressions

on:
  push:
    branches: [feature/entity-multi-edit]
    paths:
      - src/electron.renderer/data/MultiEntityEdit.hx
      - src/electron.renderer/ui/MultiEntityInstanceEditor.hx
      - src/electron.renderer/tool/SelectionTool.hx
      - app/scripts/*entity-multi*
      - .github/workflows/entity-multi-regressions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-entity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: xvfb-run -a -s "-screen 0 1600x1100x24" node scripts/run-entity-multi-tests.cjs
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entity-multi-results
          path: app/test-results/entity-multi
          if-no-files-found: warn
          retention-days: 7

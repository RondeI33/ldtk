name: test-windows

on:
  push:
    branches:
      - master
      - dev*
  pull_request:
    branches:
      - master
      - dev*

permissions:
  contents: read

concurrency:
  group: test-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      # Use the same dependency forks as the actual application build. The old
      # tong/hxelectron setup lacks electron.Clipboard and fails before testing.
      - name: Install project Haxe dependencies
        run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compile production application
        working-directory: app
        run: npm run compile
      - name: Selection runtime regression on Windows
        working-directory: app
        run: npm run test:selection
      - name: PSD import runtime regression
        working-directory: app
        run: npm run test:psd-import
      - name: Save Windows selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-windows-evidence-${{ github.sha }}
          path: app/test-results/selection
          if-no-files-found: warn

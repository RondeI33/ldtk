name: Remove LDtk lighting via API

on:
  push:
    branches:
      - remove/lighting-keep-animated-tiles
    paths:
      - .github/workflows/remove-lighting-via-api.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch branch without checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: remove/lighting-keep-animated-tiles
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          PATH_LR="src/electron.renderer/display/LayerRender.hx"
          TMP=$(mktemp)

          gh api "repos/$REPO/contents/$PATH_LR?ref=$TARGET_BRANCH" --jq .content | tr -d '\n' | base64 -d > "$TMP"
          python3 - "$TMP" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = "\tpublic function new() {\n\t\tLightPreview.ensure();\n\t}\n"
          new = "\tpublic function new() {}\n"
          if old not in s:
              raise SystemExit('Expected LightPreview hook not found')
          s = s.replace(old, new, 1)
          if 'LightPreview' in s:
              raise SystemExit('LayerRender still references LightPreview')
          p.write_text(s, encoding='utf-8')
          PY

          SHA=$(gh api "repos/$REPO/contents/$PATH_LR?ref=$TARGET_BRANCH" --jq .sha)
          CONTENT=$(base64 -w0 "$TMP")
          gh api --method PUT "repos/$REPO/contents/$PATH_LR" \
            -f message='Remove LightPreview hook and keep animated tiles' \
            -f content="$CONTENT" -f sha="$SHA" -f branch="$TARGET_BRANCH" >/dev/null

          delete_path() {
            local path="$1"
            local sha
            sha=$(gh api "repos/$REPO/contents/$path?ref=$TARGET_BRANCH" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api --method DELETE "repos/$REPO/contents/$path" \
                -f message="Remove $path" -f sha="$sha" -f branch="$TARGET_BRANCH" >/dev/null
            fi
          }

          delete_path "src/electron.renderer/display/LightPreview.hx"
          delete_path "docs/FORK_LIGHTING_PREVIEW.md"
          delete_path "scripts/remove-lighting-preview.py"
          delete_path ".github/workflows/apply-remove-lighting-preview.yml"
          delete_path ".github/workflows/remove-lighting-via-api.yml"

name: Entity Variables layout hotfix release

on:
  push:
    branches:
      - release/entity-variables-layout-hotfix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ldtk-entity-variables-layout-hotfix-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - name: Install Haxe libraries
        shell: bash
        run: |
          haxelib install uuid --quiet
          haxelib git castle https://github.com/ncannasse/castle
          haxelib git heaps https://github.com/deepnight/heaps.git
          haxelib git hxnodejs https://github.com/HaxeFoundation/hxnodejs.git
          haxelib git electron https://github.com/tong/hxelectron.git
          haxelib git heaps-aseprite https://github.com/AustinEast/heaps-aseprite.git
          haxelib git ldtk-haxe-api https://github.com/deepnight/ldtk-haxe-api.git --always
          haxelib git deepnightLibs https://github.com/deepnight/deepnightLibs.git --always
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install
      - name: Compile fork
        working-directory: app
        run: npm run compile
      - name: Package Windows x64
        working-directory: app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build --win --x64 --publish never
      - name: Rename Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "app/redist" -Filter "LDtk * installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "LDtk Windows installer was not produced" }
          Copy-Item $installer.FullName "LDtk-1.5.3-Entity-Variables-Layout-Hotfix-win-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: entity-variables-layout-hotfix-windows
          path: LDtk-1.5.3-Entity-Variables-Layout-Hotfix-win-x64.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install
      - name: Package universal macOS
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack-macos
      - name: Rename macOS installer
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.dmg' | head -n 1)
          if [ -z "$DMG" ]; then echo "LDtk macOS DMG was not produced"; exit 1; fi
          cp "$DMG" "LDtk-1.5.3-Entity-Variables-Layout-Hotfix-macOS-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: entity-variables-layout-hotfix-macos
          path: LDtk-1.5.3-Entity-Variables-Layout-Hotfix-macOS-universal.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - run: haxe setup.hxml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        working-directory: app
        run: npm install
      - name: Package Linux x86_64 AppImage
        working-directory: app
        run: npm run pack-linux-x86
      - name: Rename Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then echo "LDtk Linux AppImage was not produced"; exit 1; fi
          cp "$APPIMAGE" "LDtk-1.5.3-Entity-Variables-Layout-Hotfix-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: entity-variables-layout-hotfix-linux
          path: LDtk-1.5.3-Entity-Variables-Layout-Hotfix-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: entity-variables-layout-hotfix-*
          merge-multiple: true
          path: dist
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="entity-variables-layout-hotfix"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LDtk 1.5.3 - Entity Variables Layout Hotfix" \
            --notes "Hotfix for the RondeI33 LDtk 1.5.3 fork. Restores the Entity Variables settings pane after the previous scrolling regression and keeps the editor order as: Entity settings, Variables, Auto children, then Fork authoring. The Variables editor now has a stable usable height while the entire right column scrolls, so stock variable controls remain visible and fork additions stay below them. Includes the Variable Previews toggle below Zen Mode plus all previous Dither authoring tools, Aseprite layer picker/support, Atlas Composer, and animated-tile preview features. Includes Windows x64, universal macOS, and Linux x86_64 AppImage builds." \
            --prerelease

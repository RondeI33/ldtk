name: Camera preview offline verification bundle
on:
  push:
    branches: [feature/joshua-camera-preview-lock]
    paths: ['.github/workflows/camera-preview-dev-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: haxe setup.hxml
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Collect tracked sources and public test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/camera-preview-bundle"
          mkdir -p "$OUT"
          git archive HEAD | gzip > "$OUT/source-pr68.tar.gz"
          git fetch https://github.com/RondeI33/ldtk.git feature/joshua-locked-camera-preview --depth=1
          git archive FETCH_HEAD | gzip > "$OUT/source-pr67.tar.gz"
          HAXE_ROOT=$(dirname "$(readlink -f "$(command -v haxe)")")
          test -d "$HAXE_ROOT/std"
          tar -czf "$OUT/haxe.tar.gz" -C "$HAXE_ROOT" haxe haxelib std
          if [ -f "$HAXE_ROOT/haxelib.n" ]; then cp "$HAXE_ROOT/haxelib.n" "$OUT/"; fi
          HAXELIB_ROOT=$(haxelib config)
          tar --exclude=.git -czf "$OUT/haxelib-libraries.tar.gz" -C "$HAXELIB_ROOT" .
          tar -czf "$OUT/node-modules.tar.gz" -C app node_modules
          if [ -n "${NEKOPATH:-}" ] && [ -f "$NEKOPATH/neko" ]; then
            tar -czf "$OUT/neko.tar.gz" -C "$NEKOPATH" .
          fi
          ldd "$HAXE_ROOT/haxe" > "$OUT/haxe-ldd.txt"
          mkdir -p "$OUT/runtime-libs"
          for lib in /lib/x86_64-linux-gnu/libpcre.so.3 /usr/lib/x86_64-linux-gnu/libpcre.so.3; do
            if [ -f "$lib" ]; then cp -L "$lib" "$OUT/runtime-libs/"; break; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: camera-preview-offline-verification
          path: ${{ runner.temp }}/camera-preview-bundle
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

name: Dither authoring tools UI fix release

on:
  push:
    branches:
      - feature/auto-place-sub-entities
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ldtk-dither-authoring-tools-ui-fix-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - name: Install Haxe libraries
        shell: bash
        run: |
          haxelib install uuid --quiet
          haxelib git castle https://github.com/ncannasse/castle
          haxelib git heaps https://github.com/deepnight/heaps.git
          haxelib git hxnodejs https://github.com/HaxeFoundation/hxnodejs.git
          haxelib git electron https://github.com/tong/hxelectron.git
          haxelib git heaps-aseprite https://github.com/AustinEast/heaps-aseprite.git
          haxelib git ldtk-haxe-api https://github.com/deepnight/ldtk-haxe-api.git --always
          haxelib git deepnightLibs https://github.com/deepnight/deepnightLibs.git --always

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Compile fork
        working-directory: app
        run: npm run compile

      - name: Package Windows x64
        working-directory: app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder build --win --x64 --publish never

      - name: Rename Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "app/redist" -Filter "LDtk * installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "LDtk Windows installer was not produced" }
          Copy-Item $installer.FullName "LDtk-1.5.3-Dither-Authoring-Tools-UI-Fix-win-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: dither-authoring-tools-ui-fix-windows
          path: LDtk-1.5.3-Dither-Authoring-Tools-UI-Fix-win-x64.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - run: haxe setup.hxml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Package universal macOS
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run pack-macos

      - name: Rename macOS installer
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "LDtk macOS DMG was not produced"
            exit 1
          fi
          cp "$DMG" "LDtk-1.5.3-Dither-Authoring-Tools-UI-Fix-macOS-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dither-authoring-tools-ui-fix-macos
          path: LDtk-1.5.3-Dither-Authoring-Tools-UI-Fix-macOS-universal.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.3'

      - run: haxe setup.hxml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Package Linux x86_64 AppImage
        working-directory: app
        run: npm run pack-linux-x86

      - name: Rename Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.AppImage' | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "LDtk Linux AppImage was not produced"
            exit 1
          fi
          cp "$APPIMAGE" "LDtk-1.5.3-Dither-Authoring-Tools-UI-Fix-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: dither-authoring-tools-ui-fix-linux
          path: LDtk-1.5.3-Dither-Authoring-Tools-UI-Fix-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dither-authoring-tools-ui-fix-*
          merge-multiple: true
          path: dist

      - name: Publish cross-platform prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dither-authoring-tools-ui-fix"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LDtk 1.5.3 - Dither Authoring Tools UI Fix" \
            --notes "Cross-platform prerelease of the RondeI33 LDtk 1.5.3 fork. Fixes the Entity Definitions editor so the expanded right-hand configuration area scrolls vertically and the Variables section remains reachable on shorter windows. Adds a Variable Previews toggle directly below Zen Mode in the Visuals toolbar; one click hides or restores entity field/variable previews in the level viewport without changing field values, fork sidecar data, project JSON, or exported Unity-facing data. Entity identifiers and EntityRef links remain visible. Includes all previous Dither authoring tools: auto-placed children, field-driven appearance variants, conditional fields and enum filtering, entity-driven tile stamps, sidecar compatibility, plus the fork's Aseprite layer picker, Aseprite tileset support, Atlas Composer, and animated-tile preview work. Includes Windows x64, universal macOS, and Linux x86_64 AppImage builds." \
            --prerelease

<div class="preview"></div>

<div class="input">
	<span>#</span>
	<input type="text" placeholder="rrggbb" />
	<button class="copy gray"> <div class="icon copy"></div> </button>
	<button class="paste dark"> <div class="icon paste"></div> </button>
	<button class="nullify red"> <div class="icon delete"></div> </button>
</div>

<div class="picker"></div>

<div class="rgb" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px">
	<label>R <input class="red" type="number" min="0" max="255" step="1" aria-label="Red" style="width:64px" /></label>
	<label>G <input class="green" type="number" min="0" max="255" step="1" aria-label="Green" style="width:64px" /></label>
	<label>B <input class="blue" type="number" min="0" max="255" step="1" aria-label="Blue" style="width:64px" /></label>
</div>

<div class="recentColors">
	<div class="expand">
		<span class="icon expanded on"></span>
		<span class="icon collapsed off"></span>
		<span class="showAll off">Colors used for this element</span>
		<span class="showAll on">All colors used in this project</span>

	</div>
	<div class="recents"></div>
</div>

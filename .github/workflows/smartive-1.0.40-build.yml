name: Build LDTK-Smartive 1.0.40 from master

# Merge only after the nonpublishing PR preflight passes. Installer creation
# is gated again here by the existing selection and full editor regressions.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/smartive-1.0.40-build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartive-1.0.40-master-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    name: Selection flip regression gates, installers and v1.0.40
    uses: ./.github/workflows/ldtk-smartive-1.0.0-release.yml
    with:
      force_rebuild: false
      notify_slack: false
    secrets: inherit

name: Apply lighting toolbar sizing fix

on:
  push:
    branches:
      - fix/lighting-toolbar-sizing
    paths:
      - .github/workflows/apply-lighting-toolbar-sizing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lighting-toolbar-sizing
          fetch-depth: 0

      - name: Patch LightPreview sizing
        run: python3 scripts/patch-lighting-toolbar-sizing.py

      - name: Commit fix and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-lighting-toolbar-sizing-fix.yml
          git rm scripts/patch-lighting-toolbar-sizing.py
          git add src/electron.renderer/display/LightPreview.hx
          git commit -m "Fix lighting Visuals toolbar sizing"
          git push origin HEAD:fix/lighting-toolbar-sizing

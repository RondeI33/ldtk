name: package-macOS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    strategy:
      matrix:
        os: [macos-latest]
        haxe: [4.3.3]
      fail-fast: true
    runs-on: macos-latest

    steps:
      # Checkout, install haxe and libs
      - uses: actions/checkout@v2
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      # Node/NPM commands
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: cd app && npm install
      - run: cd app && npm run pack-prepare
      - run: cd app && npm run pack-macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Locate universal Smartive macOS installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./app/package.json').version")
          DMG=$(find app/redist -maxdepth 1 -type f -name "LDTK-Smartive-${VERSION}-mac-*.dmg" | head -n 1)
          if [ -z "$DMG" ]; then
            echo "No LDTK-Smartive macOS DMG was produced"
            find app/redist -maxdepth 1 -type f -print
            exit 1
          fi
          OUT="LDTK-Smartive-${VERSION}-mac-universal.dmg"
          if [ "$DMG" != "$OUT" ]; then
            cp "$DMG" "$OUT"
          else
            cp "$DMG" "./$OUT"
          fi
          echo "SMARTIVE_MAC_DMG=$OUT" >> "$GITHUB_ENV"

      - name: Add macOS build to test release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="smartive-master-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SMARTIVE_MAC_DMG" --clobber
          else
            gh release create "$TAG" \
              "$SMARTIVE_MAC_DMG" \
              --target "master" \
              --title "LDTK-Smartive master test build" \
              --notes "Automated universal macOS test build of the current LDTK-Smartive master branch." \
              --prerelease
          fi

      # Upload Actions artifact too
      - uses: actions/upload-artifact@v7
        with:
          name: mac-distribution
          path: LDTK-Smartive-*-mac-universal.dmg

name: Apply editor preview source patch

on:
  push:
    branches:
      - feature/editor-preview-lighting-animated-tiles
    paths:
      - .github/workflows/apply-editor-preview-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editor-preview-lighting-animated-tiles
          fetch-depth: 0

      - name: Patch LayerRender integration
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/electron.renderer/display/LayerRender.hx')
          s = p.read_text(encoding='utf-8')

          broken = '''\t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t}\n\t\treturn found ? best : 250;'''
          fixed = '''\t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn found ? best : 250;'''
          if broken in s:
              s = s.replace(broken, fixed, 1)

          old_ctor = 'public function new() {}'
          new_ctor = 'public function new() {\n\t\tLightPreview.ensure();\n\t}'
          if old_ctor in s:
              s = s.replace(old_ctor, new_ctor, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/electron.renderer/display/LayerRender.hx
          git commit -m "Fix animated tile timer and hook light preview"
          git push origin HEAD:feature/editor-preview-lighting-animated-tiles
